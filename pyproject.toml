[project]
name = "pdf-extractext-exporter"
version = "0.1.0"
description = "Microservicio que exporta un resumen en Markdown a un documento Word (.docx)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-docx>=1.2.0",
    "markdown-it-py>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
